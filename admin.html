<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | EL WAZEER STORE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root { --gold: #d4af37; --bg-main: #0a0a0a; --bg-card: #141414; --border: rgba(212, 175, 55, 0.3); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: #fff; padding: 15px; direction: rtl; }
    .gold-text { color: var(--gold); }
    .container { max-width: 450px; margin: 0 auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; margin-bottom: 20px; }
    h2, h3 { margin-bottom: 15px; text-align: center; }
    label { font-size: 13px; color: #ccc; margin-bottom: 5px; display: block; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { border-color: var(--gold); }
    input[type="file"] { padding: 8px; background: #181818; cursor: pointer; }
    .btn-gold { width: 100%; background: var(--gold); color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none; }
    .prod-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2a2a2a; }
    .prod-info { display: flex; align-items: center; gap: 12px; }
    .prod-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gold); }
    .btn-del { background: #dc2626; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">

    <!-- تسجيل الدخول -->
    <div id="login-section" class="card">
      <h2 class="gold-text"><i class="fa-solid fa-user-shield"></i> تسجيل دخول الأدمن</h2>
      <label>البريد الإلكتروني:</label>
      <input type="email" id="admin-email" placeholder="basimalbarhomy@gmail.com">
      <label>كلمة السر:</label>
      <input type="password" id="admin-pass" placeholder="••••••••">
      <button onclick="login()" class="btn-gold">دخول اللوحة</button>
    </div>

    <!-- لوحة الإدارة -->
    <div id="admin-panel" class="hidden">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 class="gold-text" style="margin:0;"><i class="fa-solid fa-boxes-stacked"></i> لوحة المنتجات</h2>
        <button onclick="logout()" style="background:#333; color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer;">خروج</button>
      </div>

      <div class="card">
        <h3 class="gold-text" style="font-size: 15px; text-align: right;"><i class="fa-solid fa-plus"></i> إضافة منتج جديد</h3>
        
        <label>اسم المنتج:</label>
        <input type="text" id="prod-name" placeholder="مثال: خط اورانج مميز">

        <label>وصف المنتج:</label>
        <textarea id="prod-desc" placeholder="أدخل تفاصيل ومميزات المنتج هنا..."></textarea>

        <label>السعر (جنيه):</label>
        <input type="number" id="prod-price" placeholder="150">

        <label>صورة المنتج من الموبايل:</label>
        <input type="file" id="prod-file" accept="image/*">

        <button onclick="addProduct()" id="save-btn" class="btn-gold">نشر المنتج 🚀</button>
      </div>

      <h3 class="gold-text" style="font-size: 15px; text-align: right;"><i class="fa-solid fa-list"></i> المنتجات المعروضة</h3>
      <div id="products-list"></div>

    </div>

  </div>

  <script>
    const ALLOWED_EMAIL = "basimalbarhomy@gmail.com";
    const ALLOWED_PASS = "Basem@1262006";

    const firebaseConfig = {
      apiKey: "AIzaSyAFg2M1CBG30SXixuDnjvl6B34LpU0qAQw",
      authDomain: "el-wazeer-store-f0d79.firebaseapp.com",
      projectId: "el-wazeer-store-f0d79",
      messagingSenderId: "881773348108",
      appId: "1:881773348108:web:9396ff63c5c0a8c67f3529",
      measurementId: "G-DWF7N4MR90"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function login() {
      const email = document.getElementById('admin-email').value.trim();
      const pass = document.getElementById('admin-pass').value.trim();

      if (email.toLowerCase() !== ALLOWED_EMAIL.toLowerCase() || pass !== ALLOWED_PASS) {
        alert("خطأ: البريد الإلكتروني أو كلمة السر غير صحيحة!");
        return;
      }

      auth.signInWithEmailAndPassword(email, pass).catch(err => {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadProducts();
      });
    }

    function logout() { 
      auth.signOut();
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('admin-panel').classList.add('hidden');
    }

    auth.onAuthStateChanged(user => {
      if (user && user.email.toLowerCase() === ALLOWED_EMAIL.toLowerCase()) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadProducts();
      }
    });

    // دالة لضغط الصور لتفادي تجاوز الـ 1MB
    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    async function addProduct() {
      const name = document.getElementById('prod-name').value;
      const desc = document.getElementById('prod-desc').value;
      const price = document.getElementById('prod-price').value;
      const fileInput = document.getElementById('prod-file');
      const btn = document.getElementById('save-btn');

      if (!name || !price || !fileInput.files[0]) {
        return alert("يرجى ملء جميع البيانات واختيار صورة!");
      }

      btn.innerText = "جاري الحفظ والضغط...";
      btn.disabled = true;

      try {
        // ضغط الصورة تلقائياً قبل الرفع
        const imageUrl = await compressImage(fileInput.files[0]);

        await db.collection('products').add({
          name: name,
          desc: desc,
          price: price,
          imageUrl: imageUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("تم نشر المنتج بنجاح! 🎉");
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-desc').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-file').value = '';
      } catch (err) {
        alert("خطأ في الحفظ: " + err.message);
      } finally {
        btn.innerText = "نشر المنتج 🚀";
        btn.disabled = false;
      }
    }

    function loadProducts() {
      const list = document.getElementById('products-list');
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        list.innerHTML = '';
        snapshot.forEach(doc => {
          const item = doc.data();
          list.innerHTML += `
            <div class="prod-item">
              <div class="prod-info">
                <img src="${item.imageUrl}" class="prod-img">
                <div>
                  <div style="font-size: 13px; font-weight: bold;">${item.name}</div>
                  <div style="font-size: 11px; color: #aaa;">${item.desc || ''}</div>
                  <div class="gold-text" style="font-size: 12px; font-weight: bold;">${item.price} جنيه</div>
                </div>
              </div>
              <button onclick="deleteProduct('${doc.id}')" class="btn-del"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
        });
      });
    }

    function deleteProduct(id) {
      if(confirm("هل تريد حذف هذا المنتج؟")) db.collection('products').doc(id).delete();
    }
  </script>
</body>
</html>
