<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>لوحة التحكم | EL WAZEER STORE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root { --gold: #d4af37; --bg-main: #0a0a0a; --bg-card: #141414; --border: rgba(212, 175, 55, 0.3); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: #fff; padding: 15px; direction: rtl; }
    .gold-text { color: var(--gold); }
    .container { max-width: 450px; margin: 0 auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; margin-bottom: 20px; }
    h2, h3 { margin-bottom: 15px; text-align: center; }
    label { font-size: 13px; color: #ccc; margin-bottom: 5px; display: block; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { border-color: var(--gold); }
    input[type="file"] { padding: 8px; background: #181818; cursor: pointer; }
    .btn-gold { width: 100%; background: var(--gold); color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none; }
    .prod-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2a2a2a; }
    .prod-info { display: flex; align-items: center; gap: 12px; }
    .prod-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gold); }
    .btn-del { background: #dc2626; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">

    <!-- تسجيل الدخول -->
    <div id="login-section" class="card">
      <h2 class="gold-text"><i class="fa-solid fa-user-shield"></i> تسجيل دخول الأدمن</h2>
      <label>البريد الإلكتروني:</label>
      <input type="email" id="admin-email" placeholder="البريد الإلكتروني" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label>كلمة السر:</label>
      <input type="password" id="admin-pass" placeholder="كلمة السر" autocomplete="off">
      <div id="login-error" style="color:#f87171; font-size:12px; text-align:center; margin-bottom:10px; min-height:16px;"></div>
      <button onclick="login()" id="login-btn" class="btn-gold">دخول اللوحة</button>
    </div>

    <!-- لوحة الإدارة -->
    <div id="admin-panel" class="hidden">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 class="gold-text" style="margin:0;"><i class="fa-solid fa-boxes-stacked"></i> لوحة المنتجات</h2>
        <button onclick="logout()" style="background:#333; color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer;">خروج</button>
      </div>

      <div class="card">
        <h3 class="gold-text" style="font-size: 15px; text-align: right;"><i class="fa-solid fa-plus"></i> إضافة منتج جديد</h3>
        
        <label>اسم المنتج:</label>
        <input type="text" id="prod-name" placeholder="مثال: خط اورانج مميز">

        <label>وصف المنتج:</label>
        <textarea id="prod-desc" placeholder="أدخل تفاصيل ومميزات المنتج هنا..."></textarea>

        <label>السعر (جنيه):</label>
        <input type="number" id="prod-price" placeholder="150">

        <label>صورة المنتج من الموبايل:</label>
        <input type="file" id="prod-file" accept="image/*">

        <button onclick="addProduct()" id="save-btn" class="btn-gold">نشر المنتج 🚀</button>
      </div>

      <h3 class="gold-text" style="font-size: 15px; text-align: right;"><i class="fa-solid fa-list"></i> المنتجات المعروضة</h3>
      <div id="products-list"></div>

    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbYnc5Nckvu4V65rL1LmArUmGvIWKIa4M",
      authDomain: "el-wazeer-store.firebaseapp.com",
      projectId: "el-wazeer-store",
      storageBucket: "el-wazeer-store.firebasestorage.app",
      messagingSenderId: "344053990930",
      appId: "1:344053990930:web:127e356e494928b8a57acb",
      measurementId: "G-SMX0GF4F5B"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // لا يوجد بريد أو كلمة سر داخل الكود: التحقق يتم بالكامل من Firebase Authentication،
    // والحماية الحقيقية للبيانات في قواعد Firestore (Rules) على السيرفر.
    let unsubscribeProducts = null;
    let failedAttempts = 0;
    let lockUntil = 0;
    let idleTimer = null;
    const IDLE_LIMIT_MS = 15 * 60 * 1000; // خروج تلقائي بعد 15 دقيقة خمول

    // الجلسة تنتهي بإغلاق المتصفح
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(() => {});

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showError(msg) { document.getElementById('login-error').innerText = msg || ''; }

    function showPanel(show) {
      document.getElementById('login-section').classList.toggle('hidden', show);
      document.getElementById('admin-panel').classList.toggle('hidden', !show);
    }

    async function login() {
      const btn = document.getElementById('login-btn');
      const now = Date.now();
      if (now < lockUntil) {
        return showError('محاولات كثيرة خاطئة. انتظر ' + Math.ceil((lockUntil - now) / 1000) + ' ثانية.');
      }
      const email = document.getElementById('admin-email').value.trim();
      const pass = document.getElementById('admin-pass').value;
      if (!email || !pass) return showError('اكتب البريد وكلمة السر.');

      btn.disabled = true;
      showError('');
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        failedAttempts = 0;
        document.getElementById('admin-pass').value = '';
        // فتح اللوحة يتم فقط من onAuthStateChanged بعد نجاح Firebase
      } catch (err) {
        failedAttempts++;
        if (failedAttempts >= 5) {
          lockUntil = Date.now() + 60 * 1000;
          failedAttempts = 0;
          showError('تم إيقاف الدخول دقيقة بسبب محاولات خاطئة متكررة.');
        } else {
          showError('البريد أو كلمة السر غير صحيحة.');
        }
        document.getElementById('admin-pass').value = '';
      } finally {
        btn.disabled = false;
      }
    }

    function logout() {
      auth.signOut();
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { if (auth.currentUser) auth.signOut(); }, IDLE_LIMIT_MS);
    }
    ['click', 'keydown', 'touchstart', 'mousemove'].forEach(ev =>
      document.addEventListener(ev, () => { if (auth.currentUser) resetIdleTimer(); }, { passive: true })
    );

    auth.onAuthStateChanged(user => {
      if (user) {
        showPanel(true);
        resetIdleTimer();
        loadProducts();
      } else {
        clearTimeout(idleTimer);
        if (unsubscribeProducts) { unsubscribeProducts(); unsubscribeProducts = null; }
        document.getElementById('products-list').innerHTML = '';
        showPanel(false);
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !document.getElementById('login-section').classList.contains('hidden')) login();
    });

    // دالة لضغط الصور لتفادي تجاوز الـ 1MB
    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    async function addProduct() {
      if (!auth.currentUser) return;
      const name = document.getElementById('prod-name').value.trim();
      const desc = document.getElementById('prod-desc').value.trim();
      const price = document.getElementById('prod-price').value;
      const fileInput = document.getElementById('prod-file');
      const btn = document.getElementById('save-btn');

      if (!name || !price || !fileInput.files[0]) {
        return alert("يرجى ملء جميع البيانات واختيار صورة!");
      }

      btn.innerText = "جاري الحفظ والضغط...";
      btn.disabled = true;

      try {
        // ضغط الصورة تلقائياً قبل الرفع
        const imageUrl = await compressImage(fileInput.files[0]);

        await db.collection('products').add({
          name: name,
          desc: desc,
          price: Number(price),
          imageUrl: imageUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("تم نشر المنتج بنجاح! 🎉");
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-desc').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-file').value = '';
      } catch (err) {
        alert("خطأ في الحفظ: " + err.message);
      } finally {
        btn.innerText = "نشر المنتج 🚀";
        btn.disabled = false;
      }
    }

    function loadProducts() {
      if (unsubscribeProducts) unsubscribeProducts();
      const list = document.getElementById('products-list');
      unsubscribeProducts = db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        list.innerHTML = '';
        snapshot.forEach(doc => {
          const item = doc.data();
          const safeImg = String(item.imageUrl || '').startsWith('data:image/') ? item.imageUrl : '';
          list.innerHTML += `
            <div class="prod-item">
              <div class="prod-info">
                <img src="${esc(safeImg)}" class="prod-img" alt="">
                <div>
                  <div style="font-size: 13px; font-weight: bold;">${esc(item.name)}</div>
                  <div style="font-size: 11px; color: #aaa;">${esc(item.desc || '')}</div>
                  <div class="gold-text" style="font-size: 12px; font-weight: bold;">${esc(item.price)} جنيه</div>
                </div>
              </div>
              <button data-id="${esc(doc.id)}" class="btn-del"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
        });
      }, err => {
        list.innerHTML = '<p style="color:#f87171;font-size:12px;text-align:center;">لا توجد صلاحية لعرض المنتجات.</p>';
        if (err.code === 'permission-denied') auth.signOut();
      });
    }

    document.getElementById('products-list').addEventListener('click', e => {
      const btn = e.target.closest('.btn-del');
      if (btn) deleteProduct(btn.dataset.id);
    });

    function deleteProduct(id) {
      if (!auth.currentUser) return;
      if (confirm("هل تريد حذف هذا المنتج؟")) {
        db.collection('products').doc(id).delete().catch(err => alert("لا يمكن الحذف: " + err.message));
      }
    }
  </script>
</body>
</html>
